
name: Deploy WordPress Theme Aruba

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build Vite assets
        run: |
          npm ci
          npm run build

      - name: Prepare theme
        run: |
          mkdir -p deploy-theme
          rsync -a ./ deploy-theme/ \
            --exclude='deploy-theme/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.agents/' \
            --exclude='.env*' \
            --exclude='src/' \
            --exclude='package*.json' \
            --exclude='vite.config.js' \
            --exclude='*.md'

      - name: Deploy test
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy-theme/
          server-dir: ${{ vars.ARUBA_THEME_DIR }}
          dry-run: true
