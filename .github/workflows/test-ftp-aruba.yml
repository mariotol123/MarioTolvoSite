
name: Test scrittura FTP Aruba

on:
  workflow_dispatch:

jobs:
  test-ftp:
    runs-on: ubuntu-latest

    steps:
      - name: Prepara file di test
        run: |
          mkdir -p ftp-test
          echo "Test GitHub Aruba OK" > ftp-test/test.txt

      - name: Test upload FTP Aruba
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./ftp-test/
          server-dir: /www.mariotolvosite.it/wp-content/themes/mt-deploy-test/
          dry-run: false
          dangerous-clean-slate: false
